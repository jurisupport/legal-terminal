name: Package v0.1.356
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            mac_targets: zip
          - os: macos-15
            arch: arm64
            mac_targets: dmg zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d8cc427ec901beea13e11449c351023c969594a0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build application
        run: npm run build

      - name: Package macOS
        run: npx electron-builder --mac ${{ matrix.mac_targets }} --${{ matrix.arch }} --publish never

      - name: Upload macOS
        run: |
          gh release upload "v0.1.356" dist/legal-terminal-mac-${{ matrix.arch }}.* --clobber
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            gh release upload "v0.1.356" dist/latest-mac.yml --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d8cc427ec901beea13e11449c351023c969594a0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build application
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish never

      - name: Upload Windows
        run: gh release upload v0.1.356 dist/legal-terminal-Setup.exe dist/legal-terminal-Setup.exe.blockmap dist/legal-terminal-portable.exe dist/latest.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

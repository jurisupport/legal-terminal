name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # 수동 실행 가능

permissions:
  contents: write # Release 생성/업로드 권한

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" --title "$title" --notes "Automated release $tag"

  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            mac_targets: zip
          - os: macos-15
            arch: arm64
            mac_targets: dmg zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify native terminal binary
        run: npm run verify:node-pty

      - name: Build renderer/main (electron-vite)
        run: npm run build

      - name: Package & publish macOS
        run: npx electron-builder --mac ${{ matrix.mac_targets }} --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    name: Windows (x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify native terminal binary
        run: npm run verify:node-pty:win

      - name: Build renderer/main (electron-vite)
        run: npm run build

      - name: Package & publish Windows
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ github.token }}

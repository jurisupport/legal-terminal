name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # 수동 실행 가능

permissions:
  contents: write # Release 생성/업로드 권한

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify installer scripts
        run: node scripts/verify-windows-installer.mjs

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # prerelease로 먼저 만든다 — 빌드가 끝나기 전에 /releases/latest가
        # 자산 없는 새 릴리스를 가리켜 설치 스크립트가 404 나는 것을 막는다.
        # 빌드 완료 후 finalize-release가 정식 릴리스로 전환한다.
        run: |
          tag="${GITHUB_REF_NAME}"
          title="${tag#v}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$title" --notes "Automated release $tag" --prerelease
          fi
          gh release upload "$tag" install-mac.sh install.ps1 install-windows.ps1 --clobber

  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            mac_targets: zip
          - os: macos-15
            arch: arm64
            mac_targets: dmg zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify desktop and case-management runtime
        run: npm run verify:desktop

      - name: Verify HTML selection and quoting
        run: npm run verify:html-quote

      - name: Verify native media review
        run: npm run verify:media && npm run verify:media-viewer && npm run verify:media-ui
        env:
          LT_MEDIA_UI_OUTPUT: .omx/screenshots/media-review

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-macos-${{ matrix.arch }}
          path: |
            .omx/screenshots/**
            output/playwright/html-quote/**
          if-no-files-found: warn

      - name: Package macOS
        run: npx electron-builder --mac ${{ matrix.mac_targets }} --${{ matrix.arch }} --publish never

      - name: Upload macOS
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/legal-terminal-mac-${{ matrix.arch }}.* --clobber
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            gh release upload "$GITHUB_REF_NAME" dist/latest-mac.yml --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  build-windows:
    name: Windows (x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify desktop and case-management runtime
        run: npm run verify:desktop

      - name: Verify HTML selection and quoting
        run: npm run verify:html-quote

      - name: Verify native media review
        run: npm run verify:media && npm run verify:media-viewer && npm run verify:media-ui
        env:
          LT_MEDIA_UI_OUTPUT: .omx/screenshots/media-review

      - name: Package Windows
        run: npx electron-builder --win --publish never

      - name: Verify installed Windows application
        run: npm run verify:installed-windows

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-windows-x64
          path: |
            .omx/screenshots/**
            output/playwright/html-quote/**
          if-no-files-found: warn

      - name: Upload Windows
        run: gh release upload $env:GITHUB_REF_NAME dist/legal-terminal-Setup.exe dist/legal-terminal-Setup.exe.blockmap dist/legal-terminal-portable.exe dist/latest.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  finalize-release:
    name: Publish release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release edit "$tag" --prerelease=false --latest

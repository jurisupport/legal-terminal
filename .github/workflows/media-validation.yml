name: Windows media validation
on:
  push:
    branches: ['codex/media-validation-*']
permissions:
  contents: read
jobs:
  media:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=optional
      - run: npm run build
      - run: npm run verify:media-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-media-validation
          path: output/media-review/**

<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /><title>legal-terminal pane preview</title></head>
  <body>
    <div id="root"></div>
    <script>
      const bridge = (path = []) => new Proxy(function () {}, {
        get(_target, property) { return property === 'then' ? undefined : bridge([...path, String(property)]) },
        apply() {
          const name = path.at(-1) || ''
          if (name.startsWith('on')) return () => {}
          if (path.join('.') === 'app.info') return Promise.resolve({ platform: 'darwin' })
          if (path.join('.') === 'settings.get') return Promise.resolve({})
          if (['history', 'list', 'recent', 'profiles'].includes(name)) return Promise.resolve([])
          return Promise.resolve(undefined)
        }
      })
      window.lt = bridge()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
